<!doctype html><html><head><style>body{margin:20px}.list{width:280px}.cards{height:600px;max-height:300px;overflow-y:scroll;padding-top:55px;padding-bottom:70px}.row{height:140px;min-height:120px;margin-bottom:30px;transform:translateY(35px);position:relative;top:20px}.card{height:60px;background:#ddd;display:block}.gap{height:180px}</style><style>__CSS__</style></head><body><div class="list"><div id="cards" class="cards" data-testid="list-card-items"><div class="gap"></div><div class="collection" style="height:700px"><div class="row"><a class="card" data-testid="list-card" href="/c/a" id="a">A</a></div><div class="row"><a class="card s4t-attention-hidden" data-testid="list-card" href="/c/b" id="b">B</a></div><div class="row"><a class="card" data-testid="list-card" href="/c/c" id="c">C</a></div></div><div class="gap"></div></div><button id="add">Add a card</button></div><div class="list"><div id="unaffected" class="cards" data-testid="list-cards"><a class="card" data-testid="list-card" href="/c/u">U</a></div></div><pre id="result"></pre><script>__COMPACTOR__
const errors=[],check=(v,m)=>{if(!v)errors.push(m)},rect=id=>document.getElementById(id).getBoundingClientRect();
const cards=document.getElementById('cards'),a=document.getElementById('a'),b=document.getElementById('b'),c=document.getElementById('c');
const original=cards.style.cssText,untouched=rect('unaffected').height;
s4tCompactAttentionLists(true);
check(Math.abs(rect('c').top-rect('a').bottom-8)<1,'visible cards separated by exactly 8px');
check(Math.abs(rect('a').top-rect('cards').top)<1,'first match at top');check(cards.scrollHeight===cards.clientHeight,'no phantom scrolling');check(rect('unaffected').height===untouched,'unaffected list unchanged');
a.classList.add('s4t-attention-hidden');c.classList.add('s4t-attention-hidden');s4tCompactAttentionLists(true);
check(rect('cards').height===0,'empty list collapses');check(getComputedStyle(cards).overflowY==='hidden','empty list has no scrollbar');check(rect('add').height>0,'add card stays visible');
b.classList.remove('s4t-attention-hidden');s4tCompactAttentionLists(true);check(rect('b').height===60,'reused hidden wrapper restored');check(Math.abs(rect('b').top-rect('cards').top)<1,'switched match at top');
[a,b,c].forEach(x=>x.classList.remove('s4t-attention-hidden'));s4tCompactAttentionLists(false);
check(cards.style.cssText===original,'inline styles preserved');check(!document.querySelector('.s4t-attention-flow'),'compaction removed on clear');check(rect('cards').height>100,'native layout restored');
document.querySelectorAll('style,script').forEach(x=>x.remove());document.getElementById('result').textContent=errors.length?'FAIL: '+errors.join('; '):'PASS: gaps, top alignment, empty scrollbars, list isolation, switched filters, clear restores layout';</script></body></html>
